<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawnlight Shaderspack</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="/icon/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <a class="logo" href="#">
          <img src="/icon/icon.png" alt="Dawnlight logo">
          <span>Dawnlight</span>
        </a>
      </div>

      <div class="topbar-right">
        <nav class="nav" id="siteNav">
          <a href="#intro" data-i18n="messages.nav.intro">介绍</a>
          <a href="#versions" data-i18n="messages.nav.versions">版本</a>
          <a href="#install" data-i18n="messages.nav.install">安装</a>
          <a href="#team" data-i18n="messages.nav.team">致谢</a>
          <button class="nav-btn" id="modsBtn" type="button" data-modal-open="modsModal" data-i18n="messages.nav.donate">赞助</button>
        </nav>

        <div class="topbar-actions">
          <button
            class="nav-toggle"
            id="navToggle"
            type="button"
            aria-controls="siteNav"
            aria-expanded="false"
            data-i18n="messages.nav.menu"
            data-i18n-attr="aria-label:messages.nav.menuAria"
          >
            菜单
          </button>
          <button
            class="language-switch"
            id="languageToggle"
            type="button"
            aria-label="切换到英文"
          >
            EN
          </button>
          <button
            class="theme-switch"
            id="themeToggle"
            type="button"
            aria-pressed="false"
            aria-label="切换主题"
            data-i18n-attr="aria-label:messages.controls.themeAria"
          >
            ☼
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-inner hero-inner-accent fade-in">
        <h1>Dawnlight Shaderspack</h1>
        <p data-i18n="messages.hero.subtitle">Based On Survivalcraft 2.4 API 1.9</p>
        <div class="btn-group">
          <a class="btn primary" href="#versions" data-i18n="messages.hero.primaryCta">立即下载</a>
          <a class="btn outline" href="#intro" data-i18n="messages.hero.secondaryCta">了解更多</a>
        </div>
      </div>
    </section>

    <section id="intro" class="section fade-in">
      <h2 data-i18n="messages.sections.intro">光影包介绍</h2>
      <div id="introRoot"></div>
    </section>

    <section id="versions" class="section fade-in">
      <h2 data-i18n="messages.sections.versions">版本下载</h2>
      <div id="versionsRoot"></div>
    </section>

    <section id="changelog" class="section fade-in">
      <div id="changelogRoot"></div>
    </section>

    <section id="community" class="section fade-in">
      <div class="community-section">
        <div class="community-title">
          <span aria-hidden="true">✦</span>
          <span data-i18n="messages.sections.community">加入社区交流</span>
        </div>

        <div class="community-links">
          <a href="https://discord.gg/tGM9HErAsd" target="_blank" rel="noopener noreferrer" class="community-link">
            <span class="community-icon discord">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
              </svg>
            </span>
            <span class="community-name">Discord</span>
          </a>

          <a href="https://app.mediafire.com/folder/rivp9vtaty5hr" target="_blank" rel="noopener noreferrer" class="community-link">
            <span class="community-icon mediafire">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
              </svg>
            </span>
            <span class="community-name">MediaFire</span>
          </a>

          <a href="https://qm.qq.com/q/2fVMcQONWs" target="_blank" rel="noopener noreferrer" class="community-link">
            <span class="community-icon qq">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.37-.49 1.02-.75 3.99-1.73 6.65-2.87 7.98-3.43 3.8-1.57 4.59-1.85 5.1-1.86.11 0 .37.03.54.17.14.12.18.28.2.45-.01.06.01.24 0 .38z"/>
              </svg>
            </span>
            <span class="community-name" data-i18n="messages.community.qq">QQ 群</span>
          </a>
        </div>
      </div>

      <div class="feedback-section">
        <div class="feedback-card">
          <div class="feedback-info">
            <div class="feedback-icon">✉</div>
            <div class="feedback-text">
              <span class="feedback-label" data-i18n="messages.sections.feedback">邮件反馈</span>
              <span class="feedback-email" id="feedbackEmail">annularwind@outlook.com</span>
            </div>
          </div>

          <button class="feedback-copy-btn" id="copyEmailBtn" type="button">
            <span class="feedback-copy-icon">📋</span>
            <span id="copyBtnText" data-i18n="messages.controls.copyEmail">复制邮箱</span>
          </button>
        </div>
      </div>
    </section>

    <section id="install" class="section fade-in">
      <h2 data-i18n="messages.sections.install">安装教程</h2>
      <div id="installRoot"></div>
    </section>

    <section id="team" class="section fade-in">
      <h2 data-i18n="messages.sections.team">项目贡献者与致谢</h2>
      <div id="teamRoot"></div>
    </section>
  </main>

  <div class="modal-overlay" id="modsModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modsModalTitle">
      <div class="modal-header">
        <h2 id="modsModalTitle" data-i18n="messages.sections.donate">赞助</h2>
        <button class="modal-close" type="button" data-modal-close aria-label="Close">×</button>
      </div>
      <div id="donationSectionsRoot"></div>
    </div>
  </div>

  <footer class="footer" data-i18n="messages.footer">© 2026 Dawnlight Project | Updated 2026-04-30</footer>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
